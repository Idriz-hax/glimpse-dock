name: glimpse-dock
version: 1.0.0
description: Reports metadata-only activity and provides structured widget management.
provides_tools:
  - glimpse_widget
provides_hooks:
  - pre_llm_call
  - pre_tool_call
  - post_tool_call
  - on_human_input_request
  - on_human_input_resolved
  - on_stream_start
  - on_stream_end
  - on_session_end
  - agent_loop_stopped
